[project]
name = "plyrfm-mcp"
dynamic = ["version", "dependencies"]
description = "MCP server for plyr.fm"
readme = "README.md"
authors = [{ name = "zzstoatzz", email = "thrast36@gmail.com" }]
requires-python = ">=3.10"
license = "MIT"

keywords = ["plyr", "mcp", "music", "streaming", "atproto"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "plyrfm=={{ version }}",
    "fastmcp==4.0.0a1",
    "fastmcp-slim==4.0.0a1",
    "mcp==2.0.0b2",
    "mcp-types==2.0.0b2",
]

[project.scripts]
plyrfm-mcp = "plyrfm_mcp.server:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plyrfm_mcp"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.uv.sources]
plyrfm = { workspace = true }
