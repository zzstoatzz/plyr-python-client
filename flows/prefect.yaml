pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/zzstoatzz/plyr-python-client.git
      branch: main

deployments:
  - name: plyr-weekly-digest
    entrypoint: flows/weekly_digest.py:weekly_digest_flow
    work_pool:
      name: managed
      job_variables:
        env:
          EXTRA_PIP_PACKAGES: "pydantic-ai[mcp] prefect>=3.0 atproto"
          ANTHROPIC_API_KEY: "{{ prefect.blocks.secret.anthropic-api-key }}"
          BSKY_HANDLE: "{{ prefect.blocks.secret.bsky-handle }}"
          BSKY_PASSWORD: "{{ prefect.blocks.secret.bsky-password }}"
    schedule:
      cron: "0 12 * * 0"  # sundays at noon UTC
    tags:
      - plyr
      - digest
      - weekly
