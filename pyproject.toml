[project]
name = "plyr-workspace"
version = "0.0.0"
description = "workspace root for plyr.fm python packages"
requires-python = ">=3.10"
dependencies = [
    "atproto>=0.0.63",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
digital-audio-claudespace = { workspace = true }
plyrfm = { workspace = true }
plyrfm-mcp = { workspace = true }

[dependency-groups]
dev = [
    "digital-audio-claudespace",
    "plyrfm",
    "plyrfm-mcp",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-sugar",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["COM812"]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "PIE", # flake8-pie
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"tests/**/*.py" = ["S101"]

[tool.ty.src]
include = ["packages/*/src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", ".git", "dist", "sandbox"]

[tool.ty.environment]
python-version = "3.10"
